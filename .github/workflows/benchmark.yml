name: Benchmark

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Go
        uses: actions/setup-go@v5

      - name: Install Dlang
        uses: dlang-community/setup-dlang@v1

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.17.0

      - name: Install Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'latest'

      - name: Install packages silently
        run: |
          python -m pip install -U httpx requests urllib3 niquests
          Rscript -e "install.packages(c('httr', 'httr2'), repos='https://cloud.r-project.org', quiet=TRUE)"

      - name: Install DotNet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - name: Run benchmarks
        shell: bash
        run: ./bench.sh

      - name: Generate plot
        shell: bash
        run: |
          python -m pip install -U matplotlib
          python plot_whisker.py benchmarks.json -o benchmarks.png
          python plot_whisker.py benchmarks-python.json -o benchmarks-python.png
          python plot_whisker.py benchmarks-r.json -o benchmarks-r.png
          python plot_whisker.py benchmarks-rest.json -o benchmarks-rest.png
          cp plot_whisker.py /tmp/plot_whisker.py

      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-output
          path: benchmarks*

      - name: Checkout output branch
        uses: actions/checkout@v4
        if: github.event_name != 'pull_request'
        with:
          ref: output
          fetch-depth: 1

      - name: Download output
        uses: actions/download-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: benchmark-output

      - name: Update the plot
        if: github.event_name != 'pull_request'
        run: |
          cargo binstall -y menyoki
          for image in benchmarks.png benchmarks-python.png benchmarks-r.png benchmarks-rest.png; do
            menyoki edit --invert "$image" save "${image%.png}-bw.png"
          done

      - name: Commit to the branch
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          cp /tmp/plot_whisker.py plot_whisker.py
          git rm -q --cached benchmarks.md 2>/dev/null || true
          rm -f benchmarks.md
          set +e
          git add benchmarks* plot_whisker.py
          git commit -m "Update benchmarks"
          git push https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git output
